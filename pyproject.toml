[project]
name = "hex"
version = "2.1.0"
description = "Hex — Management site and tools for the Cox & Rathvon puzzle archive"
readme = "README.md"
requires-python = ">=3.12.8"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12.8"

# Shared
firedantic = {git = "https://github.com/altissimo-hq/firedantic.git", branch = "main"}
firedantic-extras = {git = "https://github.com/altissimo-hq/firedantic-extras.git", branch = "main"}
hexword = {git = "https://github.com/lukwam/hexword.git", rev = "main"}
google-auth = "^2.15.0"
google-cloud-firestore = "^2.15.0"
google-cloud-logging = "^3.10.0"
google-cloud-secret-manager = "^2.18.2"
google-cloud-storage = "^3.10.1"
gunicorn = "^26.0.0"
pydantic = "^2.13.0"

# Admin service (Flask)
Flask = "^3.1.3"
flask-wtf = "^1.3.0"
google-auth-oauthlib = "^1.2.0"

# API service (FastAPI)
fastapi = "^0.136.1"
uvicorn = {version = "^0.34.0", extras = ["standard"]}
google-api-python-client = "^2.196.0"

# App service
requests = "^2.32.0"

# Image processor service
Pillow = "^12.2.0"
pdf2image = "^1.17.0"
google-genai = "^2.3.0"
pypdf = "^6.12.0"
pdfplumber = "^0.11.9"

[tool.poetry.group.dev.dependencies]
djlint = "^1.36.4"
httpx = "^0.28.0"
mypy = "^2.0.0"
pytest = "^9.0.3"
ruff = "^0.15.12"
pytest-cov = "^7.1.0"
pytest-socket = "^0.7.0"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["hex"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is standard in pytest

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--disable-socket", "--allow-unix-socket"]
markers = [
    "unit: fast unit tests (no network) - DEFAULT",
    "integration: tests requiring network/emulator - OPT-IN",
    "admin: admin service tests",
    "api: api service tests",
    "app: app service tests",
]

[tool.coverage.run]
source = ["services", "scripts"]
omit = ["*/__main__.py", "*/develop.sh"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.djlint]
profile = "jinja"
indent = 2
max_line_length = 120
ignore = "H006,H021,H023,H029,H030,H031,T003,J018"
format_css = true
format_js = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
